name: Metrics

on:
  schedule:
    - cron: "0 4 * * *"     # tous les jours à 04:00 UTC
  workflow_dispatch:         # bouton "Run workflow" manuel
  push:
    branches: ["main"]

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@v3.34
        with:
          filename: metrics.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: Pokalie566
          template: classic
          base: ""                     # pas d'en-tête ni de bloc repos
          config_timezone: Europe/Paris
          config_animations: no

          # Calendrier de contributions : une bande large et basse
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          # Langages, en une ligne compacte
          plugin_languages: yes
          plugin_languages_details: percentage
          plugin_languages_limit: 5
          plugin_languages_ignored: html, css, makefile, dockerfile
